version: '3.8'

services:
  logsentinel:
    build: .
    volumes:
      - ./logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
    command: ["--help"]

  test:
    build: .
    command: pytest tests/ -v
    volumes:
      - ./:/app
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}

  shell:
    build: .
    command: bash
    volumes:
      - ./:/app
    stdin_open: true
    tty: true

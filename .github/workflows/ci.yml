name: CI/CD & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov
    
    - name: Run unit tests
      run: |
        pytest tests/unit/ -v --cov=logsentinel --cov-report=term-missing
    
    - name: Run e2e tests
      run: |
        pytest tests/e2e/ -v

  build:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: pip install -e .
    
    - name: Build package
      run: |
        python setup.py sdist bdist_wheel
    
    - name: Upload package
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  tag-and-release:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/
    
    - name: Get next version
      id: version
      run: |
        # Get current version from setup.py
        VERSION=$(grep -E "version=" setup.py | head -1 | cut -d'"' -f2)
        echo "current=$VERSION" >> $GITHUB_OUTPUT
        
        # Extract major.minor.patch
        OLD_IFS=$IFS
        IFS='.'
        read -ra VERSION_PARTS <<< "$VERSION"
        IFS=$OLD_IFS
        
        MAJOR=${VERSION_PARTS[0]}
        MINOR=${VERSION_PARTS[1]}
        PATCH=${VERSION_PARTS[2]}
        PATCH=$((PATCH + 1))
        
        NEW_VERSION="$MAJOR.$MINOR.$PATCH"
        echo "new=$NEW_VERSION" >> $GITHUB_OUTPUT
        echo "tag=v$NEW_VERSION" >> $GITHUB_OUTPUT
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: Release ${{ steps.version.outputs.tag }}
        generate_release_notes: true
        files: |
          dist/*.tar.gz
          dist/*.whl
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build Docker image
      run: docker build -t logsentinel:${{ github.sha }} .
    
    - name: Test Docker image
      run: |
        docker run logsentinel:${{ github.sha }} logsentinel --help

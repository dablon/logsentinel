name: CI/CD & Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pyinstaller
    
    - name: Run unit tests
      run: |
        pytest tests/unit/ -v --cov=logsentinel --cov-report=term-missing
    
    - name: Run e2e tests
      run: |
        pytest tests/e2e/ -v

  build-release:
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    
    strategy:
      matrix:
        include:
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install PyInstaller
      run: pip install pyinstaller
    
    - name: Build executable
      run: |
        pyinstaller --onefile --name logsentinel logsentinel.py
        mkdir -p dist
    
    - name: Create artifacts
      run: |
        cp dist/logsentinel.exe logsentinel-${{ matrix.platform }}.exe || true
        cp dist/logsentinel logsentinel-${{ matrix.platform }} || true
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: logsentinel-${{ matrix.platform }}
        path: |
          dist/logsentinel*
          config.yaml

  docker:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build Docker image
      run: docker build -t logsentinel:${{ github.sha }} .
    
    - name: Test Docker image
      run: |
        docker run logsentinel:${{ github.sha }} python3 logsentinel.py --help

  release:
    runs-on: ubuntu-latest
    needs: [build-release, docker]
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download all artifacts
      uses: actions/download-artifact@v4
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          logsentinel-ubuntu-latest
          logsentinel-macos-latest
          logsentinel-windows-latest.exe
          logsentinel-*.whl
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TAG_TOKEN }}
